<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Navenza">
<meta name="theme-color" content="#F5F3EE">
<title>NAVenza MAP</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="lib/leaflet.min.css">
<link rel="stylesheet" href="css/styles.css">
<script>window.NV_HTML_VERSION = '5.3.0';
// Filet de sécurité : si un fichier de l'app manque (mise à jour interrompue hors réseau), le dire clairement.
setTimeout(function () {
  if (window.__NV) return;
  var m = document.getElementById('boot-msg');
  if (m) m.innerHTML = '<span style="color:#FF9C8A">L\'application n\'a pas pu démarrer : des fichiers de la nouvelle version manquent sur cet appareil.</span><br><br>Ouvrez l\'app une fois avec du réseau, attendez « Prêt hors ligne », puis fermez-la et rouvrez-la.<br><br><button onclick="location.reload()" style="min-height:52px;padding:0 18px;border-radius:16px;border:none;background:#4F8461;color:#fff;font-size:17px;font-weight:700">Réessayer</button>';
}, 9000);
</script>
<script src="lib/leaflet.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/utif.js"></script>
<script src="js/layers.js"></script>
<script src="js/index-geojson.js"></script>
<script src="js/coords.js"></script>
<script src="js/symbols.js"></script>
<script src="js/importer.js"></script>
<script src="js/db.js"></script>
<script src="js/export.js"></script>
</head>
<body data-theme="soleil">

<!-- Pictogrammes (traits, aucune émoji) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
  <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="4" width="11" height="9" rx="1"/><rect x="10" y="10" width="11" height="10" rx="1"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 19h14"/></symbol>
  <symbol id="i-nav" viewBox="0 0 24 24"><path d="M12 2 20 21 12 16 4 21z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-zin" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-zout" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
</svg>

<div id="app">

  <!-- ═══ Bibliothèque ═══ -->
  <section class="view" id="view-cartes" aria-label="Bibliothèque de cartes">
    <div class="head">
      <button class="ibtn hidden" id="lib-back" data-act="libRoot" aria-label="Retour aux dossiers"><svg class="i"><use href="#i-back"/></svg></button>
      <h1 id="lib-title">Bibliothèque</h1>
      <button class="ibtn" id="lib-folder-more" data-act="folderMenu" aria-label="Actions du dossier" style="display:none"><svg class="i"><use href="#i-more"/></svg></button>
      <button class="btn primary" id="lib-import" data-act="import" aria-label="Importer une carte"><svg class="i"><use href="#i-plus"/></svg><span class="lbl">Importer</span></button>
    </div>
    <div class="status" id="lib-status"><span id="offline-status">Vérification hors ligne…</span><span>·</span><span id="gps-status">GPS…</span><span style="flex:1"></span>
      <button class="ibtn" style="width:44px;height:44px;border:none;background:transparent;color:var(--muted)" data-act="openSettings" aria-label="Réglages"><svg class="i"><use href="#i-gear"/></svg></button></div>
    <label class="search"><svg class="i sm muted"><use href="#i-search"/></svg><span class="sr">Rechercher</span>
      <input type="search" id="lib-search" placeholder="Rechercher une carte ou un dossier" autocomplete="off"></label>
    <div class="scroll" id="lib-body"></div>
  </section>

  <!-- ═══ Points et tracés ═══ -->
  <section class="view" id="view-points" aria-label="Points et tracés">
    <div class="head"><h1>Points et tracés</h1>
      <button class="btn" data-act="exportMenu"><svg class="i"><use href="#i-download"/></svg>Exporter</button></div>
    <div class="scroll" id="pts-body"></div>
  </section>

  <!-- ═══ Aperçu de toutes les cartes ═══ -->
  <section class="view" id="view-apercu" aria-label="Toutes mes cartes">
    <div id="ov-map"></div>
    <div class="map-top">
      <div class="bar"><h1 style="margin:0;flex:1;font-size:24px;align-self:center;text-shadow:0 1px 3px var(--bg)">Toutes mes cartes</h1>
        <button class="ibtn" data-act="ovLocate" aria-label="Centrer sur ma position"><svg class="i"><use href="#i-locate"/></svg></button></div>
      <div class="chips" id="ov-chips"></div>
    </div>
    <div class="map-bottom" id="ov-sheet" style="border-radius:22px 22px 0 0;max-height:46%;overflow-y:auto;padding-bottom:14px"></div>
  </section>

  <!-- ═══ Réglages ═══ -->
  <section class="view" id="view-reglages" aria-label="Réglages">
    <div class="head"><button class="ibtn" data-act="tab" data-tab="cartes" aria-label="Retour"><svg class="i"><use href="#i-back"/></svg></button><h1>Réglages</h1></div>
    <div class="scroll" id="set-body"></div>
  </section>

  <!-- ═══ Carte en navigation ═══ -->
  <section class="view full" id="view-map" aria-label="Carte">
    <div id="map"></div>
    <div id="mire" class="hidden" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="none" stroke="#fff" stroke-width="5"/><circle cx="32" cy="32" r="14" fill="none" stroke="#E5530A" stroke-width="2.5"/><path d="M32 2v18M32 44v18M2 32h18M44 32h18" stroke="#fff" stroke-width="5"/><path d="M32 2v18M32 44v18M2 32h18M44 32h18" stroke="#E5530A" stroke-width="2.5"/><circle cx="32" cy="32" r="2.5" fill="#E5530A"/></svg></div>
    <div class="map-top">
      <div class="bar">
        <button class="ibtn" data-act="mapBack" aria-label="Retour"><svg class="i"><use href="#i-back"/></svg></button>
        <button class="carte-btn" data-act="carteSwitch"><span class="main"><span class="t" id="m-carte-name">—</span><span class="s" id="m-carte-sub"></span></span><svg class="i sm"><use href="#i-down"/></svg></button>
        <button class="ibtn" data-act="cycleTheme" id="m-theme" aria-label="Changer de thème (sombre, nuit, soleil)"><svg class="i"><use href="#i-moon"/></svg></button>
      </div>
      <div class="banner hidden" id="nav-banner">
        <svg width="54" height="54" viewBox="0 0 56 56" id="nav-arrow" style="flex:none" aria-hidden="true"><path d="M28 4 46 48 28 38 10 48z" fill="var(--accent)"/></svg>
        <div class="main"><span class="lbl" id="nav-name">Vers —</span><span class="big" id="nav-dist">—</span><span class="sub" id="nav-sub">—</span></div>
        <button class="ibtn" data-act="stopNav" aria-label="Arrêter la navigation"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="banner rec hidden" id="rec-banner"><span class="rec-dot"></span><div class="main"><span class="sub" id="rec-info" style="color:var(--text);font-size:15px">Tracé en cours</span></div></div>
      <div class="banner info hidden" id="edge-banner"><div class="main"><span class="lbl" id="edge-text"></span></div>
        <button class="btn primary" data-act="edgeOpen">Ouvrir</button><button class="ibtn" data-act="edgeClose" aria-label="Ignorer"><svg class="i sm"><use href="#i-x"/></svg></button></div>
    </div>
    <div class="map-side" id="map-side">
      <button class="ibtn" data-act="zoomIn" aria-label="Zoom avant"><svg class="i lg"><use href="#i-zin"/></svg></button>
      <button class="ibtn" data-act="zoomOut" aria-label="Zoom arrière"><svg class="i lg"><use href="#i-zout"/></svg></button>
      <button class="ibtn" data-act="viseur" id="m-viseur" aria-label="Viseur avec coordonnées"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="6"/><path d="M12 1v6M12 17v6M1 12h6M17 12h6"/></svg></button>
      <button class="ibtn" data-act="layersSheet" aria-label="Calques"><svg class="i"><use href="#i-layers"/></svg></button>
      <button class="ibtn compass-btn" data-act="compass" id="m-compass" aria-label="Boussole"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 2 16 12H8z" fill="#E5533D"/><path d="M12 22 8 12h8z" fill="currentColor" opacity=".5"/></svg><small id="m-compass-lbl">N</small></button>
      <button class="ibtn" data-act="follow" id="m-follow" aria-label="Suivre ma position"><svg class="i"><use href="#i-locate"/></svg></button>
    </div>
    <div class="map-bottom" id="map-bottom">
      <button class="coords" data-act="cycleFmt" aria-label="Changer le format des coordonnées" style="border:none;background:transparent;color:var(--text);padding:4px 0;text-align:left"><span id="m-coords">Position GPS en attente…</span><span id="m-acc" style="color:var(--ok)"></span></button>
      <div class="coords sub"><span id="m-speed"></span><span id="m-head"></span><span id="m-count"></span></div>
      <div class="actions3">
        <button class="act" data-act="addPoint"><svg class="i"><use href="#i-pin"/></svg>Point</button>
        <button class="act" data-act="trace" id="m-trace"><svg class="i"><use href="#i-route"/></svg><span id="m-trace-lbl">Tracé</span></button>
        <button class="act" data-act="measure" id="m-measure"><svg class="i"><use href="#i-ruler"/></svg>Mesure</button>
      </div>
    </div>
    <div class="mire-bar hidden" id="mire-bar">
      <div class="info" id="mire-info">—</div>
      <div class="row2" id="mire-btns"></div>
    </div>
  </section>

  <!-- ═══ Fiche d'un point ═══ -->
  <section class="view full" id="view-wp" aria-label="Fiche du point">
    <div class="head">
      <button class="ibtn" data-act="closeWp" aria-label="Retour"><svg class="i"><use href="#i-back"/></svg></button>
      <h1 class="small muted" style="font-size:15px;letter-spacing:1px;text-transform:uppercase">Point</h1>
      <button class="ibtn" data-act="wpMenu" aria-label="Autres actions"><svg class="i"><use href="#i-more"/></svg></button>
    </div>
    <div class="scroll" id="wp-body"></div>
    <div class="foot">
      <button class="btn primary big" data-act="wpNav"><svg class="i"><use href="#i-nav"/></svg>Naviguer vers ce point</button>
      <div class="grid3">
        <button class="btn" data-act="wpEdit"><svg class="i sm"><use href="#i-edit"/></svg>Modifier</button>
        <button class="btn" data-act="wpMove"><svg class="i sm"><use href="#i-move"/></svg>Déplacer</button>
        <button class="btn" data-act="wpShare"><svg class="i sm"><use href="#i-share"/></svg>Partager</button>
      </div>
    </div>
  </section>

  <!-- ═══ Formulaire d'un point ═══ -->
  <section class="view full" id="view-wpform" aria-label="Modifier le point">
    <div class="head">
      <button class="ibtn" data-act="cancelWpForm" aria-label="Annuler"><svg class="i"><use href="#i-x"/></svg></button>
      <h1 class="small" id="wpf-title">Nouveau point</h1>
    </div>
    <div class="scroll" id="wpf-body"></div>
    <div class="foot"><button class="btn primary big" data-act="saveWpForm"><svg class="i"><use href="#i-check"/></svg>Enregistrer</button></div>
  </section>

  <nav id="tabbar" aria-label="Navigation principale">
    <button data-act="tab" data-tab="cartes" id="tab-cartes"><svg class="i"><use href="#i-folder"/></svg>Cartes</button>
    <button data-act="tab" data-tab="map" id="tab-map"><svg class="i"><use href="#i-map"/></svg>Navigation</button>
    <button data-act="tab" data-tab="points" id="tab-points"><svg class="i"><use href="#i-pin"/></svg>Points</button>
    <button data-act="tab" data-tab="apercu" id="tab-apercu"><svg class="i"><use href="#i-overview"/></svg>Aperçu</button>
  </nav>
</div>

<div id="sheet-bg" data-act="closeSheet"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="boot">
  <img src="icons/icon-180.png" alt="">
  <div class="msg" id="boot-msg">Ouverture de NAVenza MAP…</div>
</div>

<input type="file" id="file-import" accept=".pdf,.tif,.tiff,application/pdf,image/tiff" multiple class="hidden">
<input type="file" id="file-layer" accept=".geojson,.json,.kml,.kmz,.gpx,application/geo+json,application/json,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz,application/gpx+xml" class="hidden">
<input type="file" id="file-restore" accept=".zip,application/zip" class="hidden">
<input type="file" id="file-photo" accept="image/*" multiple class="hidden">

<script src="js/app.js"></script>
</body>
</html>
